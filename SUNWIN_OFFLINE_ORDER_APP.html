let cart=[],selected=null;

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function money(n){return '₹'+Number(n).toFixed(2)}

$('search').addEventListener('input',function(){
 let q=this.value.trim().toLowerCase();
 if(q.length<2){$('list').innerHTML='';return}
 let a=P.filter(x=>x.p.toLowerCase().includes(q)||x.n.toLowerCase().includes(q)).slice(0,40);
 $('list').innerHTML=a.length?a.map(x=>`<div class="item" onclick="pick('${encodeURIComponent(x.p)}')"><b>${esc(x.p)}</b><small>${esc(x.n)} | MRP ${money(x.m)}</small></div>`).join(''):'<div class="item">No matching part found</div>';
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('list').innerHTML=''});

function pick(enc){
 let code=decodeURIComponent(enc);selected=P.find(x=>x.p===code);
 $('search').value=selected.p;$('list').innerHTML='';
 $('sel').style.display='block';
 $('seltext').innerHTML='<b>'+esc(selected.p)+'</b><br><small>'+esc(selected.n)+' | MRP '+money(selected.m)+'</small>';
 $('q').focus();
}
function add(){
 if(!selected)return;
 let q=parseInt($('q').value||0);if(q<1){alert('Enter quantity');return}
 let old=cart.find(x=>x.p===selected.p);if(old)old.q+=q;else cart.push({...selected,q});
 selected=null;$('search').value='';$('q').value=1;$('sel').style.display='none';render();$('search').focus();
}
function render(){
 let total=0;
 if(!cart.length)$('cart').innerHTML='<div class="empty">No items added.</div>';
 else $('cart').innerHTML='<table><tr><th>PART</th><th>QTY</th><th>MRP</th><th>AMOUNT</th><th></th></tr>'+
 cart.map((x,i)=>{let a=x.q*x.m;total+=a;return `<tr><td><b>${esc(x.p)}</b><br><small>${esc(x.n)}</small></td><td>${x.q}</td><td>${money(x.m)}</td><td>${money(a)}</td><td><button class="del" onclick="removeItem(${i})">×</button></td></tr>`}).join('')+'</table>';
 $('tot').textContent=money(total);
}
function removeItem(i){cart.splice(i,1);render()}
function orderNo(){let d=new Date();return 'SW'+d.getFullYear().toString().slice(-2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+String(Date.now()).slice(-5)}
function saveOrder(){
 let r=$('retailer').value.trim();if(!r)return alert('Please enter retailer name');if(!cart.length)return alert('Please add items');
 let o={no:orderNo(),date:new Date().toLocaleDateString('en-IN'),retailer:r,items:cart};
 localStorage.setItem('SUNWIN_LAST_ORDER',JSON.stringify(o));downloadCSV(o);toast('Order saved: '+o.no);
}
function exportCSV(){let r=$('retailer').value.trim();if(!r)return alert('Enter retailer name');if(!cart.length)return alert('Add items first');downloadCSV({no:orderNo(),date:new Date().toLocaleDateString('en-IN'),retailer:r,items:cart})}
function downloadCSV(o){
 let rows=[['Order No','Date','Retailer','Part No','Part Name','MRP','Qty','Amount']];
 o.items.forEach(x=>rows.push([o.no,o.date,o.retailer,x.p,x.n,x.m,x.q,x.m*x.q]));
 let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=o.no+'.csv';a.click();
}
function newOrder(){if(confirm('Start a new order?')){cart=[];$('retailer').value='';$('search').value='';selected=null;$('sel').style.display='none';render()}}
function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
render();
</script></body></html>
